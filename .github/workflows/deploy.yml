name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Nub
        run: |
          NUB_NO_MODIFY_PATH=1 curl -fsSL https://nubjs.com/install.sh | bash
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Build app
        run: nub run build

      - name: Apply remote D1 migrations
        run: nubx wrangler d1 migrations apply token_analytics --remote

      - name: Deploy worker
        run: nubx wrangler deploy
